volumes:
  menu-db-storage:
  menu-bucket-storage:

services:
  valkey-cache:
    build: "./valkey"
    restart: on-failure
    environment:
      VALKEY_PASSWORD: password
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    develop:
      watch:
        - path: "./valkey"
          action: rebuild

  menu-bucket:
    image: adobe/s3mock:latest
    restart: on-failure
    ports:
      - "9090:9090"
      - "9191:9191"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: images
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: true
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: images
    volumes:
      - menu-bucket-storage:/images

  menu-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: menu
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d menu" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - menu-db-storage:/var/lib/postgresql/data/

  menu-api:
    build: "./menu"
    restart: on-failure
    environment:
      DATABASE_URL: postgres://postgres:password@menu-db:5432/menu?sslmode=disable
      MIGRATIONS_PATH: file://./migrations
      DATABASE_MAX_IDLE_CONNS: 10
      DATABASE_MAX_OPEN_CONNS: 10
      DATABASE_MAX_IDLE_TIME: 10m
      DATABASE_MAX_LIFETIME: 10m

      AWS_ENDPOINT_URL: http://menu-bucket.docker.orb.local:9090
      AWS_S3_BUCKET_NAME: images
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: mock-key
      AWS_SECRET_ACCESS_KEY: mock-secret

      BUCKET_URL: http://menu-bucket.docker.orb.local:9090
      BUCKET_UPLOAD_URL_EXPIRY: 15m
      BUCKET_NAME: images

      VALKEY_URL: valkey://:password@valkey-cache:6379

      RATE_LIMIT_COUNT: 15
      RATE_LIMIT_WINDOW: 1s

      ADDR: 0.0.0.0:8080
      ENVIRONMENT: development
    depends_on:
      valkey-cache:
        condition: service_healthy
      menu-db:
        condition: service_healthy
    develop:
      watch:
        - path: "./menu"
          action: rebuild

  caddy-proxy:
    build: "./caddy"
    ports:
      - "8080:8080"
    restart: on-failure
    environment:
      MENU_SERVICE_ADDR: menu-api:8080
    depends_on:
      - menu-api
    develop:
      watch:
        - path: "./caddy"
          action: rebuild