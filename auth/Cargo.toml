[package]
name = "auth"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
path = "src/lib/lib.rs"

[[bin]]
name = "api"
path = "src/bin/api/main.rs"

[dependencies]
thiserror = { version = "2.0.18" }
anyhow = { version = "1.0.102" }

argon2 = { version = "0.6.0" }
rsa = { version = "0.9.0", features = ["pem"] }
rand = { version = "0.8.0" }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
base64 = { version = "0.23.1" }

uuid = { version = "1.23.3", features = ["serde", "v7", "v4"] }
time = { version = "0.3.51", features = ["serde"] }
tracing = { version = "0.1.44" }

tokio = { version = "1.52.3", features = ["full"] }
axum = { version = "0.8.9" }
tower = { version = "0.5.3", features = ["util"] }

tonic = {version = "0.14.6"}
tonic-prost = {version = "0.14.6"}
prost = {version = "0.14.4"}

sqlx = { version = "0.9.0", features = ["uuid", "time", "postgres", "runtime-tokio"] }
fred = {version ="10.1.0"}

mockall = { version = "0.15.0" }
serde = { version = "1.0.228", features = ["derive", "std"] }
serde_json = { version = "1.0.151" }
rmp-serde = {version = "1.3.1"}
async-trait = { version = "0.1.89" }
validator = { version = "0.21.0", features = ["derive"] }
dotenv = { version = "0.15.0" }
envy = { version = "0.4.2" }

[build-dependencies]
tonic-prost-build = {version = "0.14.6"}